<!--
파일: services/webserver/src/templates/index.html
설명: Voice Converter 메인 HTML 템플릿 (업데이트됨)
변경사항:
- 커넥션 풀 상태 표시 요소 추가 (POOL AVAIL, POOL BUSY)
- 고정 크기 버튼 구조
- 시스템 상태 모니터링 강화
-->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Converter</title>
    <link rel="stylesheet" href="static/css/styles.css">
</head>
<body>
    <div class="container">
        <!-- 연결 상태 인디케이터 -->
        <div id="connectionStatus" class="connection-status"></div>
        
        <!-- 제목 -->
        <h1>Voice Converter</h1>
        
        <!-- 컨트롤 영역 -->
        <div class="controls">
            <div class="recording-section">
                <button id="voiceBtn">
                    <span class="button-text">Press to doubt</span>
                    <div id="buttonWaveAnimation" class="button-wave-animation">
                        <div class="button-wave-bar"></div>
                        <div class="button-wave-bar"></div>
                        <div class="button-wave-bar"></div>
                        <div class="button-wave-bar"></div>
                        <div class="button-wave-bar"></div>
                    </div>
                </button>
            </div>
        </div>
        
        <!-- 상태 섹션 -->
        <div class="status-section">
            <!-- 재생 인디케이터 -->
            <div id="playbackIndicator" class="playback-indicator">
                <span class="speaker-icon">🔊</span>
                <div class="playback-animation">
                    <div class="sound-wave"></div>
                    <div class="sound-wave"></div>
                    <div class="sound-wave"></div>
                </div>
                <span>Playing</span>
            </div>
        </div>
        
        <!-- 서버 상태 -->
        <div class="server-status">
            <div class="status-header">
                <span class="status-title">SYSTEM STATUS</span>
                <span id="mainStatusIndicator" class="status-indicator disconnected">●</span>
            </div>
            
            <div class="status-grid">
                <div class="status-item">
                    <span class="status-label">WEBSOCKET</span>
                    <span id="websocketStatus" class="status-value">DISCONNECTED</span>
                </div>
                <div class="status-item">
                    <span class="status-label">STT</span>
                    <span id="sttStatus" class="status-value">IDLE</span>
                </div>
                <div class="status-item">
                    <span class="status-label">VOICE</span>
                    <span id="voiceStatus" class="status-value">IDLE</span>
                </div>
                <div class="status-item">
                    <span class="status-label">TTS</span>
                    <span id="ttsStatus" class="status-value">IDLE</span>
                </div>
                <div class="status-item">
                    <span class="status-label">POOL AVAIL</span>
                    <span id="poolAvailable" class="status-value">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">POOL BUSY</span>
                    <span id="poolBusy" class="status-value">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">SESSIONS</span>
                    <span id="connCount" class="status-value">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">UPTIME</span>
                    <span id="uptime" class="status-value">00:00:00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript 모듈 로드 -->
    <script type="module" src="static/js/voice_converter.js"></script>
</body>
</html>
