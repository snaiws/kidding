syntax = "proto3";

package audio_service;

// 오디오 서비스 정의
service AudioProcessing {
    // STT 처리 (단일 요청-응답)
    rpc ProcessSTT(STTRequest) returns (STTResponse);
    
    // TTS 처리 (단일 요청-응답)
    rpc ProcessTTS(TTSRequest) returns (TTSResponse);
    
    // 헬스 체크
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// === STT 관련 메시지 ===

message STTRequest {
    string request_id = 1;
    bytes audio_data = 2;
    STTConfig config = 3;
}

message STTConfig {
    string language = 1;          // "korean", "english", "auto"
    bool enable_vad = 2;          // Voice Activity Detection 사용 여부
    int32 sample_rate = 3;        // 샘플 레이트 (기본값: 16000)
    AudioFormat format = 4;       // 오디오 포맷
}

message STTResponse {
    string request_id = 1;
    string transcription = 2;     // 변환된 텍스트
    float confidence = 3;         // 신뢰도 (0.0 ~ 1.0)
    ProcessingStats stats = 4;    // 처리 통계
    string error = 5;             // 에러 메시지 (있는 경우)
}

// === TTS 관련 메시지 ===

message TTSRequest {
    string request_id = 1;
    string text = 2;              // 변환할 텍스트
    TTSConfig config = 3;
}

message TTSConfig {
    string language = 1;          // "korean", "english"
    string voice = 2;             // 음성 종류
    float speed = 3;              // 재생 속도 (기본값: 1.0)
    float pitch = 4;              // 피치 (기본값: 1.0)
    AudioFormat format = 5;       // 출력 오디오 포맷
    int32 sample_rate = 6;        // 출력 샘플 레이트
}

message TTSResponse {
    string request_id = 1;
    bytes audio_data = 2;         // 생성된 오디오 데이터
    AudioFormat format = 3;       // 오디오 포맷
    ProcessingStats stats = 4;    // 처리 통계
    string error = 5;             // 에러 메시지 (있는 경우)
}

// === 헬스 체크 ===

message HealthCheckRequest {
    string service = 1;           // 체크할 서비스 ("stt", "tts", "all")
}

message HealthCheckResponse {
    ServingStatus status = 1;
    map<string, ServiceHealth> services = 2;
}

enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
}

message ServiceHealth {
    bool available = 1;
    string model_name = 2;
    string version = 3;
    int64 uptime_seconds = 4;
}

// === 공통 메시지 ===

message ProcessingStats {
    float processing_time_ms = 1;  // 처리 시간 (밀리초)
    string model_used = 2;         // 사용된 모델명
    int64 timestamp = 3;           // 처리 시간 (Unix timestamp)
    int32 audio_duration_ms = 4;   // 오디오 길이 (밀리초)
}

// 오디오 포맷 정의 (enum 값 중복 해결)
enum AudioFormat {
    UNKNOWN_FORMAT = 0;
    PCM_16 = 1;                   // 16-bit PCM
    PCM_24 = 2;                   // 24-bit PCM
    WAV = 3;                      // WAV 파일
    MP3 = 4;                      // MP3 파일
    FLAC = 5;                     // FLAC 파일
    OGG = 6;                      // OGG 파일
}