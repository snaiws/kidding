# docker-compose.yaml
version: '3.8'

services:
  webserver:
    build: 
      context: ./services/webserver
      dockerfile: Dockerfile
    container_name: kidding-webserver
    ports:
      - "${WEBSERVER_PORT:-8000}:8000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # STT gRPC 서버 연결 설정
      - STT_GRPC_HOST=kidding-stt
      - STT_GRPC_PORT=50051
    networks:
      - kidding-network
    depends_on:
      - stt-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  stt-server:
    build:
      context: ./services/STTserver
      dockerfile: Dockerfile
    container_name: kidding-stt
    ports:
      - "${STT_GRPC_PORT:-50051}:50051"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - kidding-network
    volumes:
      - stt_models:/app/models
      - stt_logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    shm_size: 2gb

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_HTTP_PORT:-50015}:80"    # HTTP - 8080포트로 변경
      - "${NGINX_HTTPS_PORT:-50014}:443"   # HTTPS - 8443포트로 변경
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/empty:/etc/nginx/conf.d  # 기본 설정 파일들 비우기
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - webserver
    networks:
      - kidding-network
# TTS 서버 제거됨 - 아직 구현되지 않음

# Redis 제거됨 - 현재 코드에서 사용하지 않음

volumes:
  stt_models:
    driver: local
  stt_logs:
    driver: local

networks:
  kidding-network:
    driver: bridge